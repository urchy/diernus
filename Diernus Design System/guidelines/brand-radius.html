<!-- @dsCard group="Brand" viewport="700x160" name="Corner radii" subtitle="Sheets stay square; only pills and controls curve" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--graphite);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:18px 22px}
.mono{font-family:var(--font-mono);font-size:var(--t-mono-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.row{display:flex;gap:14px;flex-wrap:wrap}</style></head><body><div class="row" style="gap:20px;align-items:flex-end">
<div><div style="width:88px;height:56px;background:var(--bone-2);border:1px solid var(--border-rule);border-radius:0"></div><div class="mono" style="margin-top:6px">--radius-0</div><div class="mono">sheets, grids</div></div><div><div style="width:88px;height:56px;background:var(--bone-2);border:1px solid var(--border-rule);border-radius:2px"></div><div class="mono" style="margin-top:6px">--radius-xs</div><div class="mono">checkbox</div></div><div><div style="width:88px;height:56px;background:var(--bone-2);border:1px solid var(--border-rule);border-radius:.3rem"></div><div class="mono" style="margin-top:6px">--radius-sm</div><div class="mono">inputs</div></div><div><div style="width:88px;height:56px;background:var(--bone-2);border:1px solid var(--border-rule);border-radius:.35rem"></div><div class="mono" style="margin-top:6px">--radius-md</div><div class="mono">cards</div></div><div><div style="width:88px;height:56px;background:var(--bone-2);border:1px solid var(--border-rule);border-radius:.6rem"></div><div class="mono" style="margin-top:6px">--radius-lg</div><div class="mono">form panel</div></div><div><div style="width:88px;height:56px;background:var(--bone-2);border:1px solid var(--border-rule);border-radius:999px"></div><div class="mono" style="margin-top:6px">--radius-pill</div><div class="mono">buttons, chips</div></div>
</div></body></html>
