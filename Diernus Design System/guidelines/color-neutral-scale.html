<!-- @dsCard group="Colors" viewport="700x140" name="Graphite alphas" subtitle="One ink, four opacities — the whole neutral system" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--graphite);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:18px 22px}
.mono{font-family:var(--font-mono);font-size:var(--t-mono-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.row{display:flex;gap:14px;flex-wrap:wrap}</style></head><body><div class="row">
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--graphite);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">graphite</div><div class="mono">100%</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--graphite-60);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">graphite-60</div><div class="mono">60% · muted text</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--graphite-35);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">graphite-35</div><div class="mono">35% · rules</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--graphite-15);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">graphite-15</div><div class="mono">15% · hairlines</div></div>
</div></body></html>
