<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Bone paper, its alt tone, and white card stock" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--graphite);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:18px 22px}
.mono{font-family:var(--font-mono);font-size:var(--t-mono-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.row{display:flex;gap:14px;flex-wrap:wrap}</style></head><body><div class="row">
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--bone);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Bone</div><div class="mono">#EDEAE3</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--bone-2);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Bone 2</div><div class="mono">#E4E0D6</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:#FFFFFF;border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Card</div><div class="mono">#FFFFFF</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--graphite);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Graphite</div><div class="mono">#23211C</div></div>
</div></body></html>
