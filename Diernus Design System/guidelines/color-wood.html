<!-- @dsCard group="Colors" viewport="700x150" name="Wood ramp" subtitle="Four-step shading used on isometric timber faces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--graphite);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:18px 22px}
.mono{font-family:var(--font-mono);font-size:var(--t-mono-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.row{display:flex;gap:14px;flex-wrap:wrap}</style></head><body><div class="row">
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--wood-top);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Top</div><div class="mono">#DCBC82</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--wood-front);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Front</div><div class="mono">#C9A16B</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--wood-side);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Side</div><div class="mono">#A98250</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--wood-bottom);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Bottom</div><div class="mono">#8F6C41</div></div>
</div></body></html>
