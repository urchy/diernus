<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--graphite);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:18px 22px}
.mono{font-family:var(--font-mono);font-size:var(--t-mono-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.row{display:flex;gap:14px;flex-wrap:wrap}body{background:var(--blueprint-2)}.mono{color:var(--ink-60)}</style></head><body><div class="row">
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--blueprint);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Blueprint</div><div class="mono">#12235B</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--blueprint-2);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Blueprint 2</div><div class="mono">#0B163E</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--ink);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Ink</div><div class="mono">#EAF0FF</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--hud-line);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">HUD line</div><div class="mono">rgba(159,180,255,.85)</div></div>
</div></body></html>
