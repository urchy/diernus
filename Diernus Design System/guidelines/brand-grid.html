<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--graphite);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:18px 22px}
.mono{font-family:var(--font-mono);font-size:var(--t-mono-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.row{display:flex;gap:14px;flex-wrap:wrap}body{padding:0}</style></head><body><div style="height:200px;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:var(--grid-size) var(--grid-size);position:relative">
<div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 10%,transparent 30%,var(--bone) 78%)"></div>
<div class="mono" style="position:absolute;left:22px;bottom:16px">72px graph · radial-gradient fade to --bone at 78%</div></div></body></html>
