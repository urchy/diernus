<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--graphite);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:18px 22px}
.mono{font-family:var(--font-mono);font-size:var(--t-mono-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.row{display:flex;gap:14px;flex-wrap:wrap}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-hairline);border:1px solid var(--border-hairline)">
<div style="background:var(--bone);padding:14px 12px"><div style="font-family:var(--font-display);font-weight:900;font-size:1.8rem;line-height:1">000</div><div class="mono" style="margin-top:6px">COMPRIMENTO</div></div><div style="background:var(--bone);padding:14px 12px"><div style="font-family:var(--font-display);font-weight:900;font-size:1.8rem;line-height:1">000</div><div class="mono" style="margin-top:6px">PROFUNDIDADE</div></div><div style="background:var(--bone);padding:14px 12px"><div style="font-family:var(--font-display);font-weight:900;font-size:1.8rem;line-height:1">000</div><div class="mono" style="margin-top:6px">ALTURA</div></div><div style="background:var(--bone);padding:14px 12px"><div style="font-family:var(--font-display);font-weight:900;font-size:1.8rem;line-height:1">000</div><div class="mono" style="margin-top:6px">PESO</div></div>
</div><div class="mono" style="margin-top:12px">gap:1px over --border-hairline · never a rounded corner</div></body></html>
