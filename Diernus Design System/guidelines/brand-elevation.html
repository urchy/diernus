<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--graphite);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:18px 22px}
.mono{font-family:var(--font-mono);font-size:var(--t-mono-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.row{display:flex;gap:14px;flex-wrap:wrap}body{padding:26px 22px}</style></head><body><div class="row" style="gap:26px">
<div style="flex:1;height:110px;background:#fff;border:1px solid var(--border-hairline);box-shadow:var(--shadow-paper);display:grid;place-items:end;padding:10px"><span class="mono">--shadow-paper</span></div>
<div style="flex:1;height:110px;background:#fff;border:1px solid var(--border-hairline);box-shadow:var(--shadow-paper-hover);display:grid;place-items:end;padding:10px"><span class="mono">--shadow-paper-hover</span></div>
<div style="flex:1;height:110px;background:var(--cobalt);box-shadow:var(--shadow-blue);border-radius:var(--radius-pill);display:grid;place-items:center"><span class="mono" style="color:#fff">--shadow-blue</span></div>
</div></body></html>
