<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bone);color:var(--graphite);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:18px 22px}
.mono{font-family:var(--font-mono);font-size:var(--t-mono-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.row{display:flex;gap:14px;flex-wrap:wrap}</style></head><body><div class="row">
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--cobalt);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Cobalt</div><div class="mono">#2C49C7</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--cobalt-hover);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Cobalt hover</div><div class="mono">#3A58E0</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--amber);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Amber</div><div class="mono">#E69658</div></div>
<div style="flex:1;min-width:0"><div style="height:64px;background:var(--stamp);border:1px solid var(--border-hairline)"></div><div class="mono" style="margin-top:6px;color:var(--text-body)">Stamp red</div><div class="mono">#B3232E</div></div>
</div></body></html>
