<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>*{margin:0;box-sizing:border-box}html,body{width:1280px;height:854px;overflow:hidden}
body{display:grid;grid-template-columns:1fr 200px}
.main{background:var(--blueprint-2);display:grid;place-items:center;
background-image:linear-gradient(rgba(234,240,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(234,240,255,.07) 1px,transparent 1px);background-size:96px 96px}
.mark{font-family:var(--font-mono);font-weight:500;font-size:132px;letter-spacing:.14em;color:var(--ink);padding-left:.14em}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip i{display:block}
</style></head><body>
<div class="main"><span class="mark">DIERNUS</span></div>
<div class="strip"><i style="background:#E69658"></i><i style="background:#B3232E"></i><i style="background:#2C49C7"></i><i style="background:#12235B"></i></div>
</body></html>
